<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kantin Sija - Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-wrapper">
    <div class="title-container">
        <div class="title-left">
            <h1>🍽️ Kantin Sija</h1>
            <p>⸻ Admin Panel ⸻</p>
        </div>
        <button id="logoutBtn" class="login-header-btn" style="background:#c27e5a;">🚪 Logout</button>
    </div>

    <div class="content-wrapper">
        <div class="tab-nav">
            <button class="tab-btn active" data-tab="kasir">🧾 Kasir</button>
            <button class="tab-btn" data-tab="history">📜 Histori Transaksi</button>
            <button class="tab-btn" data-tab="stok">📦 Manajemen Stok</button>
        </div>

        <div id="kasirPanel" class="panel active-panel">
            <div class="two-columns">
                <div class="input-card">
                    <h2>📝 Entry Barang</h2>
                    <div class="form-group">
                        <label>Pilih Barang</label>
                        <select id="pilihBarang"><option value="">Loading data...</option></select>
                    </div>
                    <div class="form-group">
                        <label>Harga Satuan (Rp)</label>
                        <input type="text" id="hargaBarang" placeholder="Otomatis terisi" readonly style="background:#f5f0ea;">
                    </div>
                    <div class="form-group">
                        <label>Jumlah</label>
                        <input type="number" id="jumlahBarang" min="1" step="1" placeholder="Masukkan jumlah">
                    </div>
                    <button id="btnTambahKasir">➕ Tambah ke Daftar</button>
                </div>

                <div class="output-card">
                    <h2>📋 Daftar Belanja</h2>
                    <div class="table-container">
                        <table>
                            <thead><tr><th>No</th><th>Barang</th><th>Harga (Rp)</th><th>Jml</th><th>Subtotal</th><th>Aksi</th></tr></thead>
                            <tbody id="dataKasir"><tr><td colspan="6" style="text-align:center; padding:40px;">Belum ada barang</td></tr></tbody>
                        </table>
                    </div>
                    <div class="summary" id="summaryArea"></div>
                    <div class="payment-method">
                        <span style="font-weight:600; color:#7e5a41;">Metode Bayar :</span>
                        <label><input type="radio" name="metode" value="Cash" checked> 💵 Cash</label>
                        <label><input type="radio" name="metode" value="QRIS"> 📱 QRIS</label>
                        <label><input type="radio" name="metode" value="Transfer"> 💳 Transfer</label>
                    </div>
                    <button class="btn-lanjut" id="btnLanjut">🔒 Lanjut Pembayaran</button>
                </div>
            </div>
        </div>

        <div id="historyPanel" class="panel">
            <div class="history-list" id="historyList"><div class="empty-history">Belum ada transaksi selesai.</div></div>
        </div>

        <div id="stokPanel" class="panel">
            <div class="output-card" style="width: 100%;">
                <h2>📦 Manajemen Stok (Admin)</h2>
                <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
                    <input type="text" id="namaStok" placeholder="Nama Barang" style="flex:1; min-width: 150px;">
                    <input type="number" id="hargaStok" placeholder="Harga (Rp)" style="flex:1; min-width: 150px;">
                    <input type="number" id="jumlahStok" placeholder="Stok" style="flex:1; min-width: 150px;">
                    <button id="btnTambahStok" style="width: auto; margin:0; padding: 12px 24px;">➕ Tambah Barang Baru</button>
                </div>
                <div class="table-container">
                    <table>
                        <thead><tr><th>Barang</th><th>Harga</th><th>Stok</th><th>Aksi</th></tr></thead>
                        <tbody id="tabelStokAdmin">
                            <tr><td colspan="4" style="text-align:center;">Loading data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="modalUang" class="modal-uang">
    <div class="modal-card">
        <h3>💵 Uang Diterima</h3>
        <div class="form-group">
            <label>Total Belanja: <span id="uangTotalBelanja">Rp 0</span></label>
            <input type="number" id="uangDiterima" min="0" step="1000" placeholder="Masukkan nominal uang">
        </div>
        <button id="btnProsesUang">Proses Pembayaran</button>
        <button id="btnBatalUang" style="background:#e7cfbe; color:#7b543b;">Batal</button>
    </div>
</div>
<div id="modalStruk" class="modal-struk"><div class="modal-content" id="modalContent"></div></div>

<script type="module">
    import { supabase } from './supabase.js';

    // 1. KEAMANAN AKSES
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) window.location.href = 'index.html';
    else if (session.user.email !== 'admin@kantin.com') { alert('Akses Ditolak!'); window.location.href = 'user.html'; }

    document.getElementById('logoutBtn').onclick = async () => { await supabase.auth.signOut(); window.location.href = 'index.html'; };

    // 2. NAVIGASI TAB
    const tabBtns = document.querySelectorAll('.tab-btn');
    const panels = document.querySelectorAll('.panel');
    tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            tabBtns.forEach(b => b.classList.remove('active')); panels.forEach(p => p.classList.remove('active-panel'));
            btn.classList.add('active'); document.getElementById(btn.getAttribute('data-tab') + 'Panel').classList.add('active-panel');
        });
    });

    // 3. FUNGSI LOAD STOK & SINKRONISASI KASIR
    window.loadStok = async function() {
        try {
            // Mengambil data dari tabel "menu" sesuai database kamu
            const { data, error } = await supabase.from('menu').select('*').order('nama', { ascending: true });
            if (error) throw error;
            
            const tbody = document.getElementById('tabelStokAdmin');
            const selectKasir = document.getElementById('pilihBarang');
            
            if (data && data.length > 0) {
                let htmlTabel = '';
                let htmlSelect = '<option value="">-- Pilih Barang --</option>';
                data.forEach(item => {
                    const warnaStok = item.stok <= 5 ? 'red' : 'green';
                    
                    // Baris Tabel dengan tombol PLUS MINUS
                    htmlTabel += `<tr>
                        <td>${item.nama}</td>
                        <td>Rp ${new Intl.NumberFormat('id-ID').format(item.harga)}</td>
                        <td style="font-weight:bold; color: ${warnaStok};">
                            <button class="btn-min-plus" onclick="ubahStok(${item.id}, ${item.stok - 1})">-</button>
                            <span class="stok-angka">${item.stok}</span>
                            <button class="btn-min-plus" onclick="ubahStok(${item.id}, ${item.stok + 1})">+</button>
                        </td>
                        <td><button class="aksi-btn delete" onclick="hapusStok(${item.id})">🗑️ Hapus</button></td>
                    </tr>`;
                    
                    // Option Dropdown
                    if(item.stok > 0) {
                        htmlSelect += `<option value="${item.nama}" data-harga="${item.harga}" data-id="${item.id}" data-stok="${item.stok}">${item.nama} - Rp ${new Intl.NumberFormat('id-ID').format(item.harga)} (Sisa: ${item.stok})</option>`;
                    }
                });
                tbody.innerHTML = htmlTabel;
                selectKasir.innerHTML = htmlSelect;
            } else {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Belum ada barang di database.</td></tr>';
                selectKasir.innerHTML = '<option value="">-- Kosong --</option>';
            }
        } catch (err) {
            console.error(err);
            document.getElementById('tabelStokAdmin').innerHTML = `<tr><td colspan="4" style="color:red;">Error membaca data. Cek console.</td></tr>`;
        }
    };

    // FUNGSI ADMIN: UBAH STOK CEPAT (+ / -)
    window.ubahStok = async (id, stokBaru) => {
        if (stokBaru < 0) return; // Mencegah stok menjadi minus
        try {
            await supabase.from('menu').update({ stok: stokBaru }).eq('id', id);
            loadStok(); // Refresh tabel seketika
        } catch (err) {
            alert('Gagal mengubah stok.');
        }
    };

    // FUNGSI ADMIN: TAMBAH BARANG BARU
    document.getElementById('btnTambahStok').onclick = async () => {
        const nama = document.getElementById('namaStok').value.trim();
        const harga = parseInt(document.getElementById('hargaStok').value);
        const stok = parseInt(document.getElementById('jumlahStok').value);
        if(!nama || isNaN(harga) || isNaN(stok)) return alert('Isi semua data barang baru!');
        
        try {
            await supabase.from('menu').insert([{ nama, harga, stok }]);
            alert('Barang berhasil ditambahkan!');
            document.getElementById('namaStok').value = ''; document.getElementById('hargaStok').value = ''; document.getElementById('jumlahStok').value = '';
            loadStok();
        } catch(err) { alert('Gagal: ' + err.message); }
    };

    // FUNGSI ADMIN: HAPUS BARANG
    window.hapusStok = async function(id) {
        if(confirm('Yakin ingin menghapus barang ini selamanya?')) { 
            await supabase.from('menu').delete().eq('id', id); 
            loadStok(); 
        }
    };

    loadStok(); // Eksekusi saat web dibuka

    // 4. LOGIKA KASIR LENGKAP
    let daftarBelanja = [], transactionHistory = [], pendingTransaction = null;
    const formatRp = (angka) => new Intl.NumberFormat('id-ID').format(angka);

    document.getElementById('pilihBarang').addEventListener('change', function() {
        document.getElementById('hargaBarang').value = this.options[this.selectedIndex].getAttribute('data-harga') || '';
    });

    function renderKasir() {
        const tbody = document.getElementById('dataKasir');
        const summary = document.getElementById('summaryArea');
        if (daftarBelanja.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:40px;">✨ Belum ada barang ✨</td></tr>';
            summary.innerHTML = `<div class="summary-row total-final"><span>Total Akhir</span><span>Rp 0</span></div>`;
            return;
        }
        let html = '', total = 0;
        daftarBelanja.forEach((item, idx) => {
            const sub = item.harga * item.jumlah; total += sub;
            html += `<tr><td>${idx+1}</td><td>${item.nama}</td><td>${formatRp(item.harga)}</td><td>${item.jumlah}</td><td>${formatRp(sub)}</td>
            <td><button class="aksi-btn delete" onclick="hapusBarang(${idx})">🗑️</button></td></tr>`;
        });
        tbody.innerHTML = html;
        const diskon = total > 100000 ? total * 0.10 : 0;
        const totalAkhir = (total - diskon) * 1.11;
        summary.innerHTML = `<div class="summary-row"><span>Total</span><span>Rp ${formatRp(total)}</span></div>
            <div class="summary-row"><span>Diskon (10%)</span><span>- Rp ${formatRp(diskon)}</span></div>
            <div class="summary-row"><span>PPN 11%</span><span>Rp ${formatRp((total-diskon)*0.11)}</span></div>
            <div class="summary-row total-final"><span>Total Akhir</span><span>Rp ${formatRp(totalAkhir)}</span></div>`;
    }

    document.getElementById('btnTambahKasir').onclick = () => {
        const sel = document.getElementById('pilihBarang');
        const opt = sel.options[sel.selectedIndex];
        const nama = opt.value, harga = parseFloat(opt.getAttribute('data-harga')), id = opt.getAttribute('data-id'), stokMax = parseInt(opt.getAttribute('data-stok'));
        let jml = parseInt(document.getElementById('jumlahBarang').value);
        
        if(!nama || isNaN(harga) || isNaN(jml) || jml < 1) return alert("Data tidak valid!");
        if(jml > stokMax) return alert(`Stok tidak cukup! Sisa stok di database: ${stokMax}`);
        
        daftarBelanja.push({ id, nama, harga, jumlah: jml });
        sel.selectedIndex = 0; document.getElementById('hargaBarang').value = ''; document.getElementById('jumlahBarang').value = '';
        renderKasir();
    };

    window.hapusBarang = (idx) => { daftarBelanja.splice(idx,1); renderKasir(); };

    document.getElementById('btnLanjut').onclick = () => {
        if(daftarBelanja.length === 0) return alert("Belum ada barang.");
        const total = daftarBelanja.reduce((s,i) => s + (i.harga * i.jumlah), 0);
        const diskon = total > 100000 ? total * 0.10 : 0;
        pendingTransaction = { totalAkhir: (total - diskon) * 1.11, metode: document.querySelector('input[name="metode"]:checked').value };
        document.getElementById('uangTotalBelanja').innerText = `Rp ${formatRp(pendingTransaction.totalAkhir)}`;
        document.getElementById('uangDiterima').value = '';
        document.getElementById('modalUang').style.display = 'flex';
    };

    document.getElementById('btnBatalUang').onclick = () => document.getElementById('modalUang').style.display = 'none';

    document.getElementById('btnProsesUang').onclick = () => {
        const uang = parseFloat(document.getElementById('uangDiterima').value);
        if(isNaN(uang) || uang < pendingTransaction.totalAkhir) return alert("Uang kurang!");
        pendingTransaction.uang = uang; pendingTransaction.kembali = uang - pendingTransaction.totalAkhir;
        document.getElementById('modalUang').style.display = 'none';
        
        document.getElementById('modalContent').innerHTML = `
            <div class="receipt-full">
                <h2 style="text-align:center;">KANTIN SIJA</h2><hr>
                <p>Metode: ${pendingTransaction.metode}</p><p>Total: Rp ${formatRp(pendingTransaction.totalAkhir)}</p>
                <p>Bayar: Rp ${formatRp(uang)}</p><p>Kembali: Rp ${formatRp(pendingTransaction.kembali)}</p>
            </div>
            <div class="btn-group-modal"><button onclick="selesaiTransaksi()">✅ Selesai & Potong Stok</button></div>`;
        document.getElementById('modalStruk').style.display = 'flex';
    };

    window.selesaiTransaksi = async () => {
        document.getElementById('modalStruk').style.display = 'none';
        alert("Memproses transaksi dan memotong stok di database...");
        
        // POTONG STOK DI TABEL MENU
        for(let item of daftarBelanja) {
            const { data } = await supabase.from('menu').select('stok').eq('id', item.id).single();
            if(data) await supabase.from('menu').update({ stok: data.stok - item.jumlah }).eq('id', item.id);
        }
        
        transactionHistory.unshift({ date: new Date().toLocaleString(), total: pendingTransaction.totalAkhir, metode: pendingTransaction.metode });
        daftarBelanja = []; renderKasir(); loadStok();
        
        document.getElementById('historyList').innerHTML = transactionHistory.map(t => 
            `<div class="history-card"><strong>${t.date}</strong><br>Total: Rp ${formatRp(t.total)} | ${t.metode}</div>`
        ).join('');
    };
</script>
</body>
</html>
