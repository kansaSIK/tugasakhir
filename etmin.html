<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kantin Sija - User Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #b07848;
            --primary-hover: #9b6a47;
            --bg-color: #fcf9f5;
            --card-bg: #ffffff;
            --text-color: #4a3b32;
            --border-color: #ecdbcf;
        }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; }
        .app-wrapper { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; margin-bottom: 20px; }
        .header-title h1 { margin: 0; font-size: 28px; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .header-title p { margin: 0; font-size: 14px; color: #8b5a3c; }
        .logout-btn { background: var(--primary); color: white; border: none; padding: 10px 24px; border-radius: 20px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .logout-btn:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .tab-nav { display: flex; gap: 15px; margin-bottom: 25px; }
        .tab-btn { background: transparent; color: #a08c7e; border: none; font-size: 16px; font-weight: 600; padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(176, 120, 72, 0.3); }
        .two-columns { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        .card { background: var(--card-bg); padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid var(--border-color); }
        .card h2 { font-size: 18px; color: var(--primary); margin-top: 0; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #666; }
        .form-control { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-family: 'Poppins', sans-serif; font-size: 14px; box-sizing: border-box; outline: none; }
        .form-control[readonly] { background-color: #f9f5f0; }
        .btn-tambah { background: var(--primary); color: white; border: none; width: 100%; padding: 14px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 15px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        thead th { background: #fdf5f0; color: #8b5a3c; font-weight: 600; text-align: left; padding: 12px; border-bottom: 2px solid var(--border-color); }
        tbody td { padding: 12px; border-bottom: 1px solid #f0e0d4; font-size: 14px; }
        .btn-hapus { background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-edit { background: #ffc107; color: #333; border: none; padding: 6px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-right: 5px; }
        .summary-area { background: #fdf5f0; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .summary-total { display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; margin-top: 10px; padding-top: 10px; border-top: 2px solid var(--border-color); }
        .payment-method { display: flex; gap: 15px; align-items: center; margin-bottom: 20px; font-size: 14px; }
        .btn-bayar { background: var(--primary); color: white; border: none; width: 100%; padding: 15px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 16px; }
        .panel { display: none; }
        .panel.active-panel { display: block; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999; justify-content: center; align-items: center; }
        .modal-card { background: white; padding: 30px; border-radius: 16px; width: 90%; max-width: 400px; text-align: center; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn-group button { flex: 1; padding: 12px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; }
        .struk-container { text-align: left; font-family: 'Courier New', monospace; font-size: 13px; background: #f9f9f9; padding: 15px; border: 1px dashed #ccc; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>
<div class="app-wrapper">
    <div class="header">
        <div class="header-title">
            <h1>🍽️ Kantin Sija</h1>
            <p>⸻ User Panel ⸻</p>
        </div>
        <button id="logoutBtn" class="logout-btn">🚪 Logout</button>
    </div>

    <div class="tab-nav">
        <button class="tab-btn active" data-tab="kasir">🧾 Kasir</button>
        <button class="tab-btn" data-tab="stok">📦 Info Stok</button>
    </div>

    <div id="kasirPanel" class="panel active-panel">
        <div class="two-columns">
            <div class="card">
                <h2>📝 Entry Barang</h2>
                <div class="form-group">
                    <label>Pilih Barang</label>
                    <select id="pilihBarang" class="form-control"><option value="">Loading data...</option></select>
                </div>
                <div class="form-group">
                    <label>Harga Satuan (Rp)</label>
                    <input type="text" id="hargaBarang" class="form-control" readonly placeholder="Otomatis terisi">
                </div>
                <div class="form-group">
                    <label>Jumlah</label>
                    <input type="number" id="jumlahBarang" class="form-control" min="1" value="1">
                </div>
                <button id="btnTambahKasir" class="btn-tambah">➕ Tambah</button>
            </div>

            <div class="card">
                <h2>📋 Daftar Belanja</h2>
                <div style="overflow-x: auto;">
                    <table>
                        <thead><tr><th>No</th><th>Barang</th><th>Harga (Rp)</th><th>Jml</th><th>Subtotal</th><th>Aksi</th></tr></thead>
                        <tbody id="dataKasir"><tr><td colspan="6" style="text-align:center; padding:30px; color:#999;">✨ Belum ada barang ✨</td></tr></tbody>
                    </table>
                </div>
                <div id="summaryArea" class="summary-area" style="display: none;">
                    <div class="summary-row"><span>Subtotal:</span> <span id="txtSubtotal">Rp 0</span></div>
                    <div class="summary-row"><span>PPN (11%):</span> <span id="txtPpn">Rp 0</span></div>
                    <div class="summary-total"><span>Total Akhir:</span> <span id="txtTotalAkhir">Rp 0</span></div>
                </div>
                <div class="payment-method">
                    <strong>Metode Bayar :</strong>
                    <label><input type="radio" name="metode" value="Cash" checked> Cash</label>
                    <label><input type="radio" name="metode" value="QRIS"> QRIS</label>
                    <label><input type="radio" name="metode" value="Transfer"> Transfer</label>
                </div>
                <div class="form-group" id="bankOption" style="display:none;">
                    <select id="bankTransfer" class="form-control">
                        <option value="BCA">BCA</option><option value="BNI">BNI</option><option value="BRI">BRI</option>
                    </select>
                </div>
                <button class="btn-bayar" id="btnLanjut">🔒 Lanjut Pembayaran</button>
            </div>
        </div>
    </div>

    <div id="stokPanel" class="panel">
        <div class="card">
            <h2>📦 Ketersediaan Stok</h2>
            <table>
                <thead><tr><th>Nama Barang</th><th>Harga</th><th>Stok Sisa</th></tr></thead>
                <tbody id="tabelStokUser"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="modalUang" class="modal">
    <div class="modal-card">
        <h3>💵 Uang Diterima</h3>
        <p>Total Tagihan: <strong id="uangTotalBelanja" style="color: var(--primary);">Rp 0</strong></p>
        <input type="number" id="uangDiterima" class="form-control" style="text-align: center; font-size: 18px;">
        <div class="btn-group">
            <button id="btnBatalUang" style="background:#e7cfbe; color:#7b543b;">Batal</button>
            <button id="btnProsesUang" style="background:var(--primary); color:white;">Proses</button>
        </div>
    </div>
</div>

<div id="modalStruk" class="modal">
    <div class="modal-card" style="max-width: 350px;">
        <h3>🧾 Struk Pembelian</h3>
        <div id="strukContent" class="struk-container"></div>
        <div class="btn-group"><button id="btnSelesaiTransaksi" style="background:#28a745; color:white; width:100%;">✅ Selesai Transaksi</button></div>
    </div>
</div>

<script type="module">
    import { supabase } from './supabase.js';

    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { window.location.href = 'index.html'; }
    document.getElementById('logoutBtn').onclick = async () => { await supabase.auth.signOut(); window.location.href = 'index.html'; };

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active-panel'));
            btn.classList.add('active');
            document.getElementById(btn.getAttribute('data-tab') + 'Panel').classList.add('active-panel');
        });
    });

    let daftarBelanja = [], listStokData = [], pendingTransaction = null, editIndex = -1;
    const formatRp = (angka) => new Intl.NumberFormat('id-ID').format(angka);

    async function loadData() {
        const { data } = await supabase.from('produk').select('*').order('nama', { ascending: true });
        listStokData = data || [];
        document.getElementById('tabelStokUser').innerHTML = listStokData.map(item => `<tr><td>${item.nama}</td><td>Rp ${formatRp(item.harga)}</td><td style="font-weight:bold; color: ${item.stok <= 5 ? '#dc3545' : '#28a745'};">${item.stok}</td></tr>`).join('');
        document.getElementById('pilihBarang').innerHTML = '<option value="">-- Pilih Barang --</option>' + listStokData.filter(i => i.stok > 0).map(i => `<option value="${i.id}" data-nama="${i.nama}" data-harga="${i.harga}" data-stok="${i.stok}">${i.nama} (${i.stok})</option>`).join('');
    }
    loadData();

    document.getElementById('pilihBarang').onchange = (e) => {
        const opt = e.target.options[e.target.selectedIndex];
        document.getElementById('hargaBarang').value = opt.dataset.harga ? formatRp(opt.dataset.harga) : '';
    };

    document.querySelectorAll('input[name="metode"]').forEach(radio => {
        radio.addEventListener('change', (e) => { document.getElementById('bankOption').style.display = (e.target.value === 'Transfer') ? 'block' : 'none'; });
    });

    window.renderKasir = function() {
        const tbody = document.getElementById('dataKasir');
        const summary = document.getElementById('summaryArea');
        let total = 0;
        if (daftarBelanja.length === 0) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:30px; color:#999;">✨ Belum ada barang ✨</td></tr>'; summary.style.display = 'none'; return; }
        
        tbody.innerHTML = daftarBelanja.map((item, idx) => {
            const subtotal = item.harga * item.jumlah; total += subtotal;
            return `<tr><td>${idx + 1}</td><td>${item.nama}</td><td>Rp ${formatRp(item.harga)}</td><td>${item.jumlah}</td><td>Rp ${formatRp(subtotal)}</td><td><button class="btn-edit" onclick="editBarang(${idx})">✏️</button><button class="btn-hapus" onclick="hapusBarang(${idx})">X</button></td></tr>`;
        }).join('');

        const ppn = total * 0.11; const totalAkhir = total + ppn;
        summary.style.display = 'block';
        document.getElementById('txtSubtotal').innerText = `Rp ${formatRp(total)}`;
        document.getElementById('txtPpn').innerText = `Rp ${formatRp(Math.round(ppn))}`;
        document.getElementById('txtTotalAkhir').innerText = `Rp ${formatRp(Math.round(totalAkhir))}`;
    };

    window.editBarang = (idx) => {
        const item = daftarBelanja[idx];
        document.getElementById('pilihBarang').value = item.id;
        document.getElementById('hargaBarang').value = formatRp(item.harga);
        document.getElementById('jumlahBarang').value = item.jumlah;
        editIndex = idx;
        const btn = document.getElementById('btnTambahKasir'); btn.innerHTML = '💾 Simpan'; btn.style.background = '#28a745';
    };

    window.hapusBarang = (idx) => { daftarBelanja.splice(idx, 1); renderKasir(); if (editIndex === idx) _resetForm(); };
    function _resetForm() { editIndex = -1; document.getElementById('pilihBarang').selectedIndex = 0; document.getElementById('hargaBarang').value = ''; document.getElementById('jumlahBarang').value = 1; const btn = document.getElementById('btnTambahKasir'); btn.innerHTML = '➕ Tambah'; btn.style.background = 'var(--primary)'; }

    document.getElementById('btnTambahKasir').onclick = () => {
        const select = document.getElementById('pilihBarang'); const opt = select.options[select.selectedIndex];
        if (!opt.value) return alert("Pilih barang dulu!");
        const id = opt.value, nama = opt.dataset.nama, harga = parseFloat(opt.dataset.harga), stokMaks = parseInt(opt.dataset.stok), jumlah = parseInt(document.getElementById('jumlahBarang').value);
        if (jumlah < 1) return alert("Jumlah minimal 1!");

        if (editIndex > -1) {
            if (jumlah > stokMaks) return alert(`Stok kurang! Sisa: ${stokMaks}`);
            daftarBelanja[editIndex] = { id, nama, harga, jumlah }; _resetForm();
        } else {
            const idx = daftarBelanja.findIndex(i => i.id === id);
            if (idx !== -1) {
                if (daftarBelanja[idx].jumlah + jumlah > stokMaks) return alert(`Stok kurang! Sisa: ${stokMaks}`);
                daftarBelanja[idx].jumlah += jumlah;
            } else {
                if (jumlah > stokMaks) return alert(`Stok kurang! Sisa: ${stokMaks}`);
                daftarBelanja.push({ id, nama, harga, jumlah });
            }
            _resetForm();
        }
        renderKasir();
    };

    document.getElementById('btnLanjut').onclick = () => {
        if (daftarBelanja.length === 0) return alert("Keranjang kosong!");
        let total = 0; daftarBelanja.forEach(i => total += (i.harga * i.jumlah));
        const totalAkhir = Math.round(total + (total * 0.11));
        const metode = document.querySelector('input[name="metode"]:checked').value;
        pendingTransaction = { totalAkhir, metode, bank: metode === 'Transfer' ? document.getElementById('bankTransfer').value : null };
        document.getElementById('uangTotalBelanja').innerText = `Rp ${formatRp(totalAkhir)}`;
        document.getElementById('modalUang').style.display = 'flex';
    };

    document.getElementById('btnBatalUang').onclick = () => { document.getElementById('modalUang').style.display = 'none'; };

    document.getElementById('btnProsesUang').onclick = () => {
        let uang = parseFloat(document.getElementById('uangDiterima').value);
        if (isNaN(uang) || uang < pendingTransaction.totalAkhir) return alert("Uang kurang/tidak valid!");
        pendingTransaction.uangDiterima = uang; pendingTransaction.kembalian = uang - pendingTransaction.totalAkhir;
        pendingTransaction.orderNumber = "ORD-" + Math.floor(Math.random() * 10000).toString().padStart(4, '0');
        document.getElementById('modalUang').style.display = 'none';
        
        let htmlStruk = `<div style="text-align:center; font-weight:bold;">KANTIN SIJA</div><div style="text-align:center;">Order: ${pendingTransaction.orderNumber}</div><hr>`;
        daftarBelanja.forEach(i => { htmlStruk += `<div style="display:flex; justify-content:space-between;"><span>${i.jumlah}x ${i.nama}</span><span>${formatRp(i.harga * i.jumlah)}</span></div>`; });
        htmlStruk += `<hr><div style="display:flex; justify-content:space-between; font-weight:bold;"><span>TOTAL</span><span>Rp ${formatRp(pendingTransaction.totalAkhir)}</span></div><div style="display:flex; justify-content:space-between;"><span>Diterima</span><span>Rp ${formatRp(pendingTransaction.uangDiterima)}</span></div><div style="display:flex; justify-content:space-between;"><span>Kembali</span><span>Rp ${formatRp(pendingTransaction.kembalian)}</span></div>`;
        document.getElementById('strukContent').innerHTML = htmlStruk;
        document.getElementById('modalStruk').style.display = 'flex';
    };

    document.getElementById('btnSelesaiTransaksi').onclick = async () => {
        try {
            const { error } = await supabase.from('transactions').insert([{
                order_number: pendingTransaction.orderNumber,
                total_akhir: pendingTransaction.totalAkhir,
                metode: pendingTransaction.metode,
                bank: pendingTransaction.bank,
                uang_diterima: pendingTransaction.uangDiterima,
                kembalian: pendingTransaction.kembalian,
                items: daftarBelanja
            }]);
            if (error) throw error;

            for (let item of daftarBelanja) {
                const prod = listStokData.find(p => p.id == item.id);
                if (prod) await supabase.from('produk').update({ stok: prod.stok - item.jumlah }).eq('id', item.id);
            }
            alert("Transaksi Sukses!");
            daftarBelanja = []; _resetForm(); renderKasir(); await loadData();
            document.getElementById('modalStruk').style.display = 'none';
        } catch (error) { alert("Gagal menyimpan ke database: " + error.message); }
    };
</script>
</body>
</html>
